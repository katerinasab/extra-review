<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --bg: #f6f3ee;
        --panel: #fffaf2;
        --card: #ffffff;
        --text: #1f1d1a;
        --muted: #6d675f;
        --border: #eadfce;
        --success: #17824f;
        --warning: #9a6b16;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 16px;
        font-family: Inter, Arial, sans-serif;
        font-size: 12px;
        line-height: 1.4;
        color: var(--text);
        background: linear-gradient(180deg, #f8f5ef 0%, #f2eee7 100%);
      }

      .app {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .hero,
      .card,
      .summary,
      .result {
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 14px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 22px;
        line-height: 1.1;
      }

      .subtitle,
      .meta,
      .back-link,
      .hint {
        color: var(--muted);
      }

      .subtitle,
      .meta,
      .hint {
        font-size: 13px;
      }

      .section-title,
      .result-title,
      label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .grid,
      .cards {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .action-card {
        width: 100%;
        text-align: left;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #fff;
        padding: 14px;
        cursor: pointer;
      }

      .action-title {
        display: block;
        margin-bottom: 4px;
        font-size: 16px;
        font-weight: 700;
      }

      .action-desc {
        color: var(--muted);
        font-size: 12px;
      }

      .hidden {
        display: none !important;
      }

      .back-link {
        border: 0;
        background: transparent;
        padding: 0;
        cursor: pointer;
        width: fit-content;
        margin-bottom: 8px;
      }

      button {
        border: 0;
        border-radius: 12px;
        padding: 10px 14px;
        cursor: pointer;
        font-size: 12px;
      }

      .primary-btn {
        background: #111;
        color: white;
      }

      .primary-btn:disabled,
      .secondary-btn:disabled,
      button:disabled {
        background: #d8d1c4;
        color: #8f877b;
        cursor: not-allowed;
      }

      .secondary-btn {
        background: #e9e4db;
        color: var(--text);
      }

      .hero-actions {
        margin-top: 16px;
      }

      .sticky-summary {
        position: sticky;
        top: 8px;
        z-index: 3;
        margin-top: 10px;
        margin-bottom: 10px;
      }

      .summary-actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      .token-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
        margin-bottom: 8px;
      }

      .token-name {
        font-size: 16px;
        font-weight: 700;
        word-break: break-word;
      }

      .badge-done,
      .badge-review {
        display: inline-flex;
        align-items: center;
        padding: 5px 9px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
      }

      .badge-done {
        background: rgba(23, 130, 79, 0.12);
        color: var(--success);
      }

      .badge-review {
        background: rgba(154, 107, 22, 0.12);
        color: var(--warning);
      }

      .collapsed .card-body {
        display: none;
      }

      .row {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 12px;
      }

      .scope-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .confidence-hint {
        margin-top: 4px;
      }

      select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: white;
        padding: 10px 12px;
        font-size: 12px;
      }

      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      .actions .secondary-btn {
        flex: 1;
      }

      .actions .primary-btn {
        flex: 1;
      }

      .result-block {
        margin-top: 12px;
      }

      .toggle-details {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        margin-top: 8px;
        text-align: center;
      }

      .details-panel {
        margin-top: 8px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #faf7f1;
      }

      .summary-block {
        white-space: pre-wrap;
        font-size: 13px;
      }

      .compact-block {
        margin-top: 10px;
      }

      .details-list {
        margin: 6px 0 0;
        padding-left: 18px;
      }

      .details-list li {
        margin-bottom: 6px;
        word-break: break-word;
      }

      .case-list {
        list-style: none;
        padding-left: 0;
        margin: 6px 0 0;
      }

      .case-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 10px;
      }

      .case-checkbox {
        width: 18px;
        height: 18px;
        margin-top: 2px;
      }

      .case-label {
        flex: 1;
        font-size: 13px;
        line-height: 1.4;
        word-break: break-word;
      }

      #resultText,
      #scopeSummaryText {
        font-size: 13px;
      }

      #scopeSummaryText {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div id="homeView">
        <div class="hero">
          <div class="section-title">Component Review</div>
          <h1>Extra Review</h1>
          <p class="subtitle">Выбери, что именно хочешь проверить или исправить в компоненте.</p>
        </div>

        <div class="grid">
          <button class="action-card" data-action="broken-tokens">
            <span class="action-title">Проверить битые токены</span>
            <span class="action-desc">Найти удалённые или потерянные variable bindings у выбранного слоя.</span>
          </button>

          <button class="action-card" data-action="raw-values">
            <span class="action-title">Применить токен</span>
            <span class="action-desc">Найти значения без токенов и предложить подходящие токены.</span>
          </button>

          <button class="action-card" data-action="scope-review">
            <span class="action-title">Определить scope</span>
            <span class="action-desc">Проверить только локальные токены текущего файла.</span>
          </button>

          <button class="action-card" data-action="fix-scope">
            <span class="action-title">Поправить scope</span>
            <span class="action-desc">Одной кнопкой исправить очевидные несовпадения scope во всех локальных токенах файла и показать список изменений.</span>
          </button>

          <button class="action-card" data-action="unused-tokens">
            <span class="action-title">Найти неиспользуемые токены</span>
            <span class="action-desc">Проверить выбранную коллекцию на неиспользуемые токены на странице.</span>
          </button>
        </div>
      </div>

      <div id="scopeView" class="hidden">
        <div class="hero">
          <button id="backToHome" class="back-link">← Extra Review / Scope Review</button>
          <h1>Определить scope</h1>
          <p class="subtitle">Выбери объекты в Figma и нажми «Проверить scope».</p>
          <div class="hero-actions">
            <button id="analyzeScopes" class="primary-btn">Проверить scope</button>
          </div>
        </div>

        <div id="scopeSummary" class="summary sticky-summary hidden">
          <div id="scopeSummaryText"></div>
          <div class="summary-actions">
            <button id="applyAll" class="secondary-btn">Применить выбранные</button>
          </div>
        </div>

        <div id="scopeCards" class="cards hidden"></div>
      </div>

      <div id="applyTokenView" class="hidden">
        <div class="hero">
          <button id="backToHomeFromApplyToken" class="back-link">← Extra Review / Apply Token</button>
          <h1>Применить токен</h1>
          <p class="subtitle">Выбери объекты в Figma и нажми «Найти значения без токенов».</p>
          <div class="hero-actions">
            <button id="analyzeApplyTokens" class="primary-btn">Найти значения без токенов</button>
          </div>
          <div class="hero-actions hidden" id="ignoredApplyTokenActions">
            <button id="toggleIgnoredApplyTokens" class="secondary-btn">Показать скрытые</button>
          </div>
        </div>

        <div id="applyTokenStatus" class="summary sticky-summary hidden">
          <div id="applyTokenStatusText"></div>
        </div>

        <div id="applyTokenCards" class="cards hidden"></div>
      </div>

      <div class="result" id="globalResult">
        <div class="result-title">Result</div>
        <div id="resultText">Выбери раздел выше, чтобы запустить проверку.</div>
      </div>
    </div>

    <script>
      const homeView = document.getElementById("homeView");
      const scopeView = document.getElementById("scopeView");
      const applyTokenView = document.getElementById("applyTokenView");
      const scopeCards = document.getElementById("scopeCards");
      const scopeSummary = document.getElementById("scopeSummary");
      const scopeSummaryText = document.getElementById("scopeSummaryText");
      const applyTokenStatus = document.getElementById("applyTokenStatus");
      const applyTokenStatusText = document.getElementById("applyTokenStatusText");
      const applyTokenCards = document.getElementById("applyTokenCards");
      const ignoredApplyTokenActions = document.getElementById("ignoredApplyTokenActions");
      const toggleIgnoredApplyTokens = document.getElementById("toggleIgnoredApplyTokens");
      const globalResult = document.getElementById("globalResult");
      const resultText = document.getElementById("resultText");
      let brokenPathsExpanded = false;
      let lastBrokenTokensResult = null;
      let currentApplyTokenGroups = [];
      let lastApplyTokenGroups = [];
      let ignoredApplyTokenGroupIds = new Set();
      let showIgnoredApplyTokenGroups = false;
      let lastScopeFixResult = null;
      let scopeFixChangesExpanded = false;
      let scopeFixReviewExpanded = false;

      function debugLog(label, payload) {
        if (payload === undefined) {
          console.log(`[ui] ${label}`);
        } else {
          console.log(`[ui] ${label}`, payload);
        }
      }

      window.onerror = function (message, source, lineno, colno, error) {
        console.error("[ui] window.onerror", {
          message,
          source,
          lineno,
          colno,
          stack: error && error.stack ? error.stack : String(error)
        });
      };

      window.onunhandledrejection = function (event) {
        console.error("[ui] unhandledrejection", event.reason);
      };

      debugLog("script loaded");

      let currentItems = [];
      let lastSummaryText = "";

      function showHome() {
        debugLog("showHome");
        homeView.classList.remove("hidden");
        scopeView.classList.add("hidden");
        applyTokenView.classList.add("hidden");
        globalResult.classList.remove("hidden");
      }

      function showScope() {
        debugLog("showScope");
        homeView.classList.add("hidden");
        scopeView.classList.remove("hidden");
        applyTokenView.classList.add("hidden");
        globalResult.classList.remove("hidden");
      }

      function showApplyToken() {
        debugLog("showApplyToken");
        homeView.classList.add("hidden");
        scopeView.classList.add("hidden");
        applyTokenView.classList.remove("hidden");
        globalResult.classList.add("hidden");
      }

      function setApplyTokenStatus(text) {
        if (!text) {
          applyTokenStatus.classList.add("hidden");
          applyTokenStatusText.textContent = "";
          return;
        }

        applyTokenStatus.classList.remove("hidden");
        applyTokenStatusText.textContent = text;
      }

      function getSummaryCounts() {
        const total = currentItems.length;
        const done = currentItems.filter((item) => item.isScopeMatched).length;
        const needReview = total - done;

        debugLog("getSummaryCounts", { total, done, needReview });

        return { total, done, needReview };
      }

      function updateSummaryText() {
        debugLog("updateSummaryText start");
        if (!lastSummaryText) {
          debugLog("updateSummaryText skipped: no summary");
          return;
        }

        const lines = lastSummaryText.split("\n");
        const counts = getSummaryCounts();

        const updated = lines.map((line) => {
          if (line.startsWith("Нужно проверить:")) {
            return `Нужно проверить: ${counts.needReview}`;
          }

          if (line.startsWith("Совпадают с предложенными:")) {
            return `Совпадают с предложенными: ${counts.done}`;
          }

          if (line.startsWith("Все scope совпадают")) {
            return counts.needReview === 0
              ? "Все scope совпадают с предложенными scope."
              : `Совпадают с предложенными: ${counts.done}`;
          }

          return line;
        });

        if (
          !updated.some((line) => line.startsWith("Совпадают с предложенными:")) &&
          !updated.some((line) => line.startsWith("Все scope совпадают"))
        ) {
          updated.push(
            counts.needReview === 0
              ? "Все scope совпадают с предложенными scope."
              : `Совпадают с предложенными: ${counts.done}`
          );
        }

        scopeSummaryText.textContent = updated.join("\n");
        debugLog("updateSummaryText done", { text: scopeSummaryText.textContent });
      }

      function applyCardUpdate(variableId, scopes) {
        debugLog("applyCardUpdate start", { variableId, scopes });

        const item = currentItems.find((entry) => entry.variableId === variableId);
        if (!item) {
          debugLog("applyCardUpdate skipped: item not found", { variableId });
          return;
        }

        item.currentScopesText = scopes.length ? scopes.join(", ") : "No scopes set";
        item.selectedScopes = [...scopes];
        item.isScopeMatched = true;

        const current = document.getElementById(`current-${variableId}`);
        const badge = document.getElementById(`badge-${variableId}`);
        const card = document.getElementById(`card-${variableId}`);

        debugLog("applyCardUpdate dom refs", {
          variableId,
          hasCurrent: !!current,
          hasBadge: !!badge,
          hasCard: !!card
        });

        if (current) {
          current.textContent = `Current scope: ${item.currentScopesText}`;
        }

        if (badge) {
          badge.textContent = "Done";
          badge.className = "badge-done";
        }

        if (card) {
          card.classList.add("collapsed");
        }

        updateSummaryText();
        debugLog("applyCardUpdate done", { variableId });
      }

      function getSelectedScopes(variableId) {
        debugLog("getSelectedScopes start", { variableId });

        const select1 = document.getElementById(`scope1-${variableId}`);
        const select2 = document.getElementById(`scope2-${variableId}`);
        const select3 = document.getElementById(`scope3-${variableId}`);

        debugLog("getSelectedScopes refs", {
          variableId,
          hasSelect1: !!select1,
          hasSelect2: !!select2,
          hasSelect3: !!select3
        });

        const values = [select1?.value || "", select2?.value || "", select3?.value || ""]
          .filter((value) => value && value !== "NONE");

        const result = [...new Set(values)];

        debugLog("getSelectedScopes result", { variableId, result });

        return result;
      }

      function renderScopeCards(items) {
        debugLog("renderScopeCards start", { count: items.length });

        currentItems = items;
        scopeCards.classList.remove("hidden");

        if (!items.length) {
          debugLog("renderScopeCards empty");
          scopeCards.innerHTML = `
            <div class="card">
              <div class="meta">Проблемных локальных токенов в текущем выделении не найдено.</div>
            </div>
          `;
          return;
        }

        scopeCards.innerHTML = items.map((item, index) => {
          debugLog("render item start", {
            index,
            variableId: item.variableId,
            variableName: item.variableName,
            selectedScopes: item.selectedScopes,
            allowedScopesCount: item.allowedScopes ? item.allowedScopes.length : 0,
            isScopeMatched: item.isScopeMatched
          });

          const selectOptions = item.allowedScopes.map((scope) => {
            const firstSelected = item.selectedScopes[0] === scope ? "selected" : "";
            return `<option value="${scope}" ${firstSelected}>${scope}</option>`;
          }).join("");

          debugLog("first select built", { variableId: item.variableId });

          const secondOptions = [
            '<option value="NONE">—</option>',
            ...item.allowedScopes.map((scope) => {
              const secondSelected = item.selectedScopes[1] === scope ? "selected" : "";
              return `<option value="${scope}" ${secondSelected}>${scope}</option>`;
            })
          ].join("");

          debugLog("second select built", { variableId: item.variableId });

          const thirdOptions = [
            '<option value="NONE">—</option>',
            ...item.allowedScopes.map((scope) => {
              const thirdSelected = item.selectedScopes[2] === scope ? "selected" : "";
              return `<option value="${scope}" ${thirdSelected}>${scope}</option>`;
            })
          ].join("");

          debugLog("third select built", { variableId: item.variableId });

          const collapsedClass = item.isScopeMatched ? "collapsed" : "";
          const confidenceHint =
            !item.isScopeMatched && item.confidence === "low"
              ? '<div class="hint confidence-hint">⚠️ Предложение неоднозначное (по статистике похожих токенов совпадает не всегда) — сверьте вручную перед применением.</div>'
              : "";

          return `
            <div class="card ${collapsedClass}" id="card-${item.variableId}">
              <div class="token-head">
                <div class="token-name">${escapeHtml(item.variableName)}</div>
                <div class="${item.isScopeMatched ? "badge-done" : "badge-review"}" id="badge-${item.variableId}">
                  ${item.isScopeMatched ? "Done" : "Need review"}
                </div>
              </div>

              <div class="meta" id="current-${item.variableId}">Current scope: ${escapeHtml(item.currentScopesText)}</div>
              <div class="meta">Suggested scope: ${escapeHtml(item.suggestedScopesText)}</div>
              ${confidenceHint}

              <div class="card-body">
                <div class="scope-row">
                  <div class="row">
                    <label for="scope1-${item.variableId}">Scope 1</label>
                    <select id="scope1-${item.variableId}">
                      ${selectOptions}
                    </select>
                  </div>

                  <div class="row">
                    <label for="scope2-${item.variableId}">Scope 2</label>
                    <select id="scope2-${item.variableId}">
                      ${secondOptions}
                    </select>
                  </div>

                  <div class="row">
                    <label for="scope3-${item.variableId}">Scope 3</label>
                    <select id="scope3-${item.variableId}">
                      ${thirdOptions}
                    </select>
                  </div>
                </div>

                <div class="hint">Во втором и третьем поле можно оставить прочерк, если scope'ов нужно меньше.</div>

                <div class="actions">
                  <button class="primary-btn" data-apply-id="${item.variableId}">Apply</button>
                </div>
              </div>
            </div>
          `;
        }).join("");

        debugLog("renderScopeCards innerHTML applied");

        const applyButtons = document.querySelectorAll("[data-apply-id]");
        debugLog("apply buttons found", { count: applyButtons.length });

        applyButtons.forEach((button) => {
          button.addEventListener("click", () => {
            const variableId = button.getAttribute("data-apply-id");
            debugLog("apply click", { variableId });

            if (!variableId) return;

            parent.postMessage(
              {
                pluginMessage: {
                  type: "apply-scope",
                  variableId,
                  scopes: getSelectedScopes(variableId)
                }
              },
              "*"
            );
          });
        });

        debugLog("renderScopeCards listeners attached");
      }

      function getSelectedCandidate(groupId) {
        const select = document.getElementById(`token-select-${groupId}`);
        return select ? select.value : "";
      }

      function getSelectedGroupMembers(groupId) {
        return Array.from(document.querySelectorAll(`[data-case-group-id="${groupId}"]`))
          .filter((input) => input.checked)
          .map((input) => input.getAttribute("data-case-item-id"))
          .filter(Boolean);
      }

      function updateGroupSelectionState(groupId) {
        const group = currentApplyTokenGroups.find((entry) => entry.groupId === groupId);
        if (!group) return;

        const selectedIds = new Set(getSelectedGroupMembers(groupId));
        const badge = document.getElementById(`apply-badge-${groupId}`);
        const applyButton = document.querySelector(`[data-apply-token-group-id="${groupId}"]`);

        if (badge) {
          if (group.isResolved) {
            badge.textContent = `Done ${selectedIds.size || group.members.length} cases`;
            badge.className = "badge-done";
          } else {
            badge.textContent = `${selectedIds.size} cases`;
            badge.className = "badge-review";
          }
        }

        if (applyButton) {
          applyButton.textContent = `Применить на ${selectedIds.size}`;
        }

        updateApplyTokenButtonState(groupId);
      }

      function updateApplyTokenButtonState(groupId) {
        const group = currentApplyTokenGroups.find((entry) => entry.groupId === groupId);
        if (!group) return;

        const button = document.querySelector(`[data-apply-token-group-id="${groupId}"]`);
        if (!button) return;

        const selectedVariableId = getSelectedCandidate(groupId);
        const selectedItemsCount = getSelectedGroupMembers(groupId).length;
        const isSameAsApplied = !!group.appliedVariableId && group.appliedVariableId === selectedVariableId;

        button.disabled = !selectedVariableId || isSameAsApplied || selectedItemsCount === 0;
      }

      function applyApplyTokenCardUpdate(groupId) {
        const group = currentApplyTokenGroups.find((entry) => entry.groupId === groupId);
        if (!group) return;

        group.isResolved = true;
        group.appliedVariableId = getSelectedCandidate(groupId);

        const badge = document.getElementById(`apply-badge-${groupId}`);

        if (badge) {
          badge.textContent = `Done ${group.members.length} cases`;
          badge.className = "badge-done";
        }

        updateApplyTokenButtonState(groupId);
      }

      function renderApplyTokenCards(groups) {
        lastApplyTokenGroups = groups;
        currentApplyTokenGroups = groups.filter((group) => {
          if (showIgnoredApplyTokenGroups) {
            return true;
          }

          return !ignoredApplyTokenGroupIds.has(group.groupId);
        });
        applyTokenCards.classList.remove("hidden");

        const ignoredCount = groups.filter((group) => ignoredApplyTokenGroupIds.has(group.groupId)).length;
        if (ignoredCount > 0) {
          ignoredApplyTokenActions.classList.remove("hidden");
          toggleIgnoredApplyTokens.textContent = showIgnoredApplyTokenGroups
            ? `Скрыть скрытые (${ignoredCount})`
            : `Показать скрытые (${ignoredCount})`;
        } else {
          ignoredApplyTokenActions.classList.add("hidden");
        }

        if (!currentApplyTokenGroups.length) {
          applyTokenCards.innerHTML = `
            <div class="card">
              <div class="meta">На выбранном объекте не найдено значений без токенов.</div>
            </div>
          `;
          return;
        }

        applyTokenCards.innerHTML = currentApplyTokenGroups.map((group) => {
          const hasCandidates = group.candidates && group.candidates.length > 0;
          const isSameAsApplied = !!group.appliedVariableId && group.appliedVariableId === group.selectedVariableId;
          const options = hasCandidates
            ? group.candidates.map((candidate) => {
                const selected = candidate.id === group.selectedVariableId ? "selected" : "";
                return `<option value="${candidate.id}" ${selected}>${escapeHtml(candidate.name)}</option>`;
              }).join("")
            : '<option value="">Подходящих токенов не найдено</option>';

          const firstReason = hasCandidates && group.candidates[0] ? group.candidates[0].reason : "Нет подходящих токенов";
          const previewPaths = (group.members || [])
            .map((member) => `
              <li class="case-item">
                <input
                  type="checkbox"
                  class="case-checkbox"
                  data-case-group-id="${group.groupId}"
                  data-case-item-id="${member.itemId}"
                  checked
                />
                <label class="case-label">${escapeHtml(member.nodePath)} / ${escapeHtml(member.propertyLabel || group.propertyLabel)}</label>
              </li>
            `)
            .join("");

          return `
            <div class="card" id="apply-card-${group.groupId}">
              <div class="token-head">
                <div class="token-name">${escapeHtml(group.propertyLabel)}</div>
                <div class="${hasCandidates ? "badge-review" : "badge-done"}" id="apply-badge-${group.groupId}">
                  ${group.isResolved ? `Done ${group.members.length} cases` : hasCandidates ? `${group.members.length} cases` : "No match"}
                </div>
              </div>

              <div class="meta">Value: ${escapeHtml(group.rawValueText)}</div>

              <div class="card-body">
                <div class="row">
                  <div class="section-title">Примеры</div>
                  <ul class="case-list">
                    ${previewPaths}
                  </ul>
                </div>

                <div class="row">
                  <label for="token-select-${group.groupId}">Подходящий токен</label>
                  <select id="token-select-${group.groupId}" ${hasCandidates ? "" : "disabled"}>
                    ${options}
                  </select>
                </div>

                <div class="hint">${escapeHtml(firstReason)}</div>

                <div class="actions">
                  <button class="primary-btn" data-apply-token-group-id="${group.groupId}" ${hasCandidates && !isSameAsApplied ? "" : "disabled"}>
                    Применить на ${group.members.length}
                  </button>
                  <button class="secondary-btn" data-ignore-token-group-id="${group.groupId}">
                    Игнорировать
                  </button>
                </div>
              </div>
            </div>
          `;
        }).join("");

        document.querySelectorAll("[data-apply-token-group-id]").forEach((button) => {
          button.addEventListener("click", () => {
            const groupId = button.getAttribute("data-apply-token-group-id");
            const group = currentApplyTokenGroups.find((entry) => entry.groupId === groupId);

            if (!group) return;

            const variableId = getSelectedCandidate(group.groupId);
            if (!variableId) return;
            const selectedItemIds = new Set(getSelectedGroupMembers(group.groupId));
            if (!selectedItemIds.size) return;

            parent.postMessage(
              {
                pluginMessage: {
                  type: "apply-all-tokens",
                  updates: group.members
                    .filter((member) => selectedItemIds.has(member.itemId))
                    .map((member) => ({
                    groupId: group.groupId,
                    itemId: member.itemId,
                    nodeId: member.nodeId,
                    variableId,
                    target: member.target
                    }))
                }
              },
              "*"
            );
          });
        });

        document.querySelectorAll("[id^='token-select-group-'], [id^='token-select-']").forEach((select) => {
          select.addEventListener("change", () => {
            const groupId = select.id.replace("token-select-", "");
            const group = currentApplyTokenGroups.find((entry) => entry.groupId === groupId);
            if (!group) return;

            group.selectedVariableId = select.value;
            updateApplyTokenButtonState(groupId);
          });
        });

        document.querySelectorAll("[data-case-group-id]").forEach((input) => {
          input.addEventListener("change", () => {
            const groupId = input.getAttribute("data-case-group-id");
            if (!groupId) return;

            updateGroupSelectionState(groupId);
          });
        });

        document.querySelectorAll("[data-ignore-token-group-id]").forEach((button) => {
          button.addEventListener("click", () => {
            const groupId = button.getAttribute("data-ignore-token-group-id");
            if (!groupId) return;

            ignoredApplyTokenGroupIds.add(groupId);
            renderApplyTokenCards(lastApplyTokenGroups);
            setApplyTokenStatus("Кейс скрыт из текущего списка.");
          });
        });

        currentApplyTokenGroups.forEach((group) => {
          updateGroupSelectionState(group.groupId);
        });
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function renderBrokenTokensResult(data) {
        lastBrokenTokensResult = data;

        const details = Array.isArray(data.details) ? data.details : [];
        const paths = Array.isArray(data.paths) ? data.paths : [];
        const hasPaths = paths.length > 0;

        const detailsHtml = details.length
          ? `
              <div class="result-block compact-block">
                <div class="section-title">Детали</div>
                <ul class="details-list">
                  ${details.map((detail) => `<li>${escapeHtml(detail)}</li>`).join("")}
                </ul>
              </div>
            `
          : "";

        const pathsHtml = hasPaths
          ? `
              <div class="result-block compact-block">
                <div class="section-title">Сломанные токены</div>
                <button id="toggleBrokenPaths" class="secondary-btn toggle-details">
                  ${brokenPathsExpanded ? "Скрыть подробности" : "Показать подробности"}
                </button>
                <div class="details-panel ${brokenPathsExpanded ? "" : "hidden"}" id="brokenPathsPanel">
                  <div class="section-title">Где найдено</div>
                  <ul class="details-list">
                    ${paths.map((path) => `<li>${escapeHtml(path)}</li>`).join("")}
                  </ul>
                </div>
              </div>
            `
          : "";

        resultText.innerHTML = `
          <div class="summary-block">${escapeHtml(data.summary || "")}</div>
          ${detailsHtml}
          ${pathsHtml}
        `;

        const toggleButton = document.getElementById("toggleBrokenPaths");
        if (toggleButton) {
          toggleButton.addEventListener("click", () => {
            brokenPathsExpanded = !brokenPathsExpanded;
            renderBrokenTokensResult(lastBrokenTokensResult || data);
          });
        }
      }

      function renderScopeFixResult(data) {
        lastScopeFixResult = data;

        const changes = Array.isArray(data.changes) ? data.changes : [];
        const needsReview = Array.isArray(data.needsReview) ? data.needsReview : [];

        const changesHtml = changes.length
          ? `
              <div class="result-block compact-block">
                <div class="section-title">Исправлено автоматически (${changes.length})</div>
                <button id="toggleScopeFixChanges" class="secondary-btn toggle-details">
                  ${scopeFixChangesExpanded ? "Скрыть список" : "Показать список"}
                </button>
                <div class="details-panel ${scopeFixChangesExpanded ? "" : "hidden"}" id="scopeFixChangesPanel">
                  <ul class="details-list">
                    ${changes.map((change) => `<li><strong>${escapeHtml(change.variableName)}</strong>: ${escapeHtml(change.fromScopesText)} → ${escapeHtml(change.toScopesText)}</li>`).join("")}
                  </ul>
                </div>
              </div>
            `
          : "";

        const needsReviewHtml = needsReview.length
          ? `
              <div class="result-block compact-block">
                <div class="section-title">Нужна ручная проверка (${needsReview.length})</div>
                <button id="toggleScopeFixReview" class="secondary-btn toggle-details">
                  ${scopeFixReviewExpanded ? "Скрыть список" : "Показать список"}
                </button>
                <div class="details-panel ${scopeFixReviewExpanded ? "" : "hidden"}" id="scopeFixReviewPanel">
                  <ul class="details-list">
                    ${needsReview.map((entry) => `<li><strong>${escapeHtml(entry.variableName)}</strong>: ${escapeHtml(entry.currentScopesText)} → предложение: ${escapeHtml(entry.suggestedScopesText)}</li>`).join("")}
                  </ul>
                  <div class="hint">Предложение неоднозначно по статистике — проверьте эти токены вручную в разделе «Определить scope».</div>
                </div>
              </div>
            `
          : "";

        resultText.innerHTML = `
          <div class="summary-block">${escapeHtml(data.summary || "")}</div>
          ${changesHtml}
          ${needsReviewHtml}
        `;

        const toggleChangesButton = document.getElementById("toggleScopeFixChanges");
        if (toggleChangesButton) {
          toggleChangesButton.addEventListener("click", () => {
            scopeFixChangesExpanded = !scopeFixChangesExpanded;
            renderScopeFixResult(lastScopeFixResult || data);
          });
        }

        const toggleReviewButton = document.getElementById("toggleScopeFixReview");
        if (toggleReviewButton) {
          toggleReviewButton.addEventListener("click", () => {
            scopeFixReviewExpanded = !scopeFixReviewExpanded;
            renderScopeFixResult(lastScopeFixResult || data);
          });
        }
      }

      document.querySelectorAll(".action-card").forEach((button) => {
        button.addEventListener("click", () => {
          const action = button.dataset.action;
          debugLog("home action click", { action });

          if (action === "scope-review") {
            showScope();
            resultText.textContent = "Открылся раздел Scope Review.";
            return;
          }

          if (action === "raw-values") {
            showApplyToken();
            resultText.textContent = "Открылся раздел Apply Token.";
            return;
          }

          if (action === "fix-scope") {
            showHome();
            resultText.textContent = "Проверяю и исправляю scope у локальных токенов файла…";
            parent.postMessage({ pluginMessage: { type: "run-fix-scope" } }, "*");
            return;
          }

          parent.postMessage({ pluginMessage: { type: "run-check", action } }, "*");
        });
      });

      document.getElementById("backToHome").addEventListener("click", () => {
        debugLog("back click");
        showHome();
      });

      document.getElementById("analyzeScopes").addEventListener("click", () => {
        debugLog("analyzeScopes click");
        parent.postMessage({ pluginMessage: { type: "run-scope-review" } }, "*");
      });

      document.getElementById("backToHomeFromApplyToken").addEventListener("click", () => {
        debugLog("back from apply token click");
        showHome();
      });

      document.getElementById("analyzeApplyTokens").addEventListener("click", () => {
        debugLog("analyzeApplyTokens click");
        parent.postMessage({ pluginMessage: { type: "run-apply-token-review" } }, "*");
      });

      toggleIgnoredApplyTokens.addEventListener("click", () => {
        showIgnoredApplyTokenGroups = !showIgnoredApplyTokenGroups;
        renderApplyTokenCards(lastApplyTokenGroups);
        setApplyTokenStatus(
          showIgnoredApplyTokenGroups
            ? "Скрытые кейсы показаны."
            : "Скрытые кейсы скрыты."
        );
      });

      document.getElementById("applyAll").addEventListener("click", () => {
        debugLog("applyAll click start");

        const updates = currentItems
          .filter((item) => !item.isScopeMatched)
          .map((item) => ({
            variableId: item.variableId,
            scopes: getSelectedScopes(item.variableId)
          }));

        debugLog("applyAll updates", updates);

        parent.postMessage(
          {
            pluginMessage: {
              type: "apply-all-scopes",
              updates
            }
          },
          "*"
        );
      });

      window.onmessage = (event) => {
        const msg = event.data.pluginMessage;
        debugLog("message received", msg);

        if (!msg) return;

        if (msg.type === "analysis-result") {
          brokenPathsExpanded = false;
          lastBrokenTokensResult = null;
          resultText.textContent = msg.text;
        }

        if (msg.type === "broken-tokens-result") {
          brokenPathsExpanded = false;
          renderBrokenTokensResult(msg);
        }

        if (msg.type === "scope-fix-result") {
          showHome();
          scopeFixChangesExpanded = false;
          scopeFixReviewExpanded = false;
          renderScopeFixResult(msg);
        }

        if (msg.type === "scope-review-result") {
          debugLog("scope-review-result start");
          showScope();
          lastSummaryText = msg.summary || "";
          scopeSummary.classList.remove("hidden");
          scopeSummaryText.textContent = lastSummaryText;
          renderScopeCards(msg.items || []);
          resultText.textContent = "Проверка scope выполнена.";
          debugLog("scope-review-result done");
        }

        if (msg.type === "apply-token-review-result") {
          showApplyToken();
          ignoredApplyTokenGroupIds = new Set();
          showIgnoredApplyTokenGroups = false;
          setApplyTokenStatus("Проверка значений без токенов выполнена.");
          renderApplyTokenCards(msg.groups || []);
        }

        if (msg.type === "apply-result") {
          debugLog("apply-result start", msg);
          resultText.textContent = msg.text;

          if (msg.variableId && Array.isArray(msg.scopes)) {
            applyCardUpdate(msg.variableId, msg.scopes);
          }

          if (Array.isArray(msg.updates)) {
            msg.updates.forEach((update) => {
              applyCardUpdate(update.variableId, update.scopes);
            });
          }

          debugLog("apply-result done");
        }

        if (msg.type === "apply-all-tokens-result") {
          debugLog("apply-all-tokens-result start", msg);
          setApplyTokenStatus(msg.text);

          if (Array.isArray(msg.groupIds)) {
            msg.groupIds.forEach((groupId) => {
              applyApplyTokenCardUpdate(groupId);
            });
          }

          debugLog("apply-all-tokens-result done");
        }

      };
    </script>
  </body>
</html>
